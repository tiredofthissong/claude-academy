<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Academy Projects | Ben Breaux</title>
  <meta name="description" content="Ben Breaux's Claude Academy projects. Under construction.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E7E0D4'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='38' font-style='italic' fill='%23C2703D' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    /* Tokens copied from benbreaux.com so both sites read as one family */
    :root {
      --paper: #FAF7F2;
      --paper-warm: #F3EEE5;
      --ink: #1B1917;
      --ink-soft: #44403C;
      --muted: #78716C;
      --faint: #A8A29E;
      --accent: #C2703D;
      --accent-deep: #9A5A2E;
      --accent-glow: #E8A87C;
      --card: #FFFFFF;
      --line: #E7E0D4;
      --skin: #E9C9A8;
      --radius-pill: 999px;
      --shadow-sm: 0 1px 2px rgba(27,25,23,.05);
      --font-display: 'Space Grotesk', 'Inter', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::selection { background: var(--accent); color: #fff; }

    /* Film grain, same as the bio page */
    .grain {
      position: fixed; inset: 0; z-index: 90; pointer-events: none; opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .page {
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      max-width: 640px; margin: 0 auto; padding: 56px 24px 32px;
      text-align: center; position: relative;
    }

    /* Drifting warm glow behind the hero */
    .aurora {
      position: absolute; inset: 0 -40px auto; height: 520px; z-index: -1;
      background:
        radial-gradient(42% 55% at 30% 40%, rgba(194,112,61,.24), transparent 70%),
        radial-gradient(38% 50% at 72% 30%, rgba(232,168,124,.20), transparent 70%),
        radial-gradient(45% 60% at 55% 75%, rgba(120,140,160,.12), transparent 70%);
      filter: blur(32px);
      animation: drift 14s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate3d(-3%, -2%, 0) scale(1); }
      to   { transform: translate3d(3%, 3%, 0) scale(1.06); }
    }

    /* Status pill */
    .status {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: .8rem; font-weight: 600; color: var(--ink-soft);
      padding: 7px 16px 7px 12px; margin-bottom: 28px;
      background: rgba(255,255,255,.7); border: 1px solid var(--line);
      border-radius: var(--radius-pill); box-shadow: var(--shadow-sm);
      animation: rise .7s cubic-bezier(.22,.61,.36,1) both;
    }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 0 rgba(194,112,61,.5);
      animation: ping 2s ease-out infinite;
    }
    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 rgba(194,112,61,.5); }
      80%, 100% { box-shadow: 0 0 0 10px rgba(194,112,61,0); }
    }

    /* Illustration */
    .scene { width: 100%; max-width: 380px; margin: 0 auto 8px; animation: rise .8s cubic-bezier(.22,.61,.36,1) .1s both; }
    .scene svg { width: 100%; height: auto; display: block; overflow: visible; }

    /* Caution stripe, a modern take on construction tape */
    .tape {
      width: min(280px, 80%); height: 6px; margin: 0 auto 36px;
      border-radius: var(--radius-pill);
      background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, var(--paper-warm) 10px 20px);
      background-size: 28.28px 100%;
      animation: tape 1.2s linear infinite, rise .8s cubic-bezier(.22,.61,.36,1) .2s both;
      opacity: .85;
    }
    @keyframes tape { to { background-position: 28.28px 0; } }

    h1 {
      font-family: var(--font-display); font-weight: 700;
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      letter-spacing: -.035em; line-height: 1.04; margin-bottom: 14px;
      animation: rise .8s cubic-bezier(.22,.61,.36,1) .25s both;
    }
    .serif { font-family: var(--font-serif); font-style: italic; font-weight: 500; letter-spacing: 0; color: var(--accent); }
    .lede {
      font-size: 1.05rem; color: var(--ink-soft); max-width: 460px; margin: 0 auto 30px;
      animation: rise .8s cubic-bezier(.22,.61,.36,1) .35s both;
    }

    .back {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: .9rem; font-weight: 600; color: var(--ink); text-decoration: none;
      padding: 11px 20px; border-radius: var(--radius-pill);
      background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm);
      transition: transform .2s ease, border-color .2s ease, color .2s ease;
      animation: rise .8s cubic-bezier(.22,.61,.36,1) .45s both;
    }
    .back:hover { transform: translateY(-2px); border-color: var(--accent-glow); color: var(--accent-deep); }
    .back:focus-visible { outline: 2px solid var(--accent-glow); outline-offset: 3px; }
    .back .arrow { color: var(--accent); transition: transform .2s ease; }
    .back:hover .arrow { transform: translateX(-3px); }

    .footer { margin-top: 56px; font-size: .8rem; color: var(--faint); }
    .footer .mono { font-family: var(--font-mono); letter-spacing: -.02em; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---- SVG animation pieces ---- */
    /* transform-box lets each SVG part scale and rotate around its own box */
    .scene * { transform-box: fill-box; }
    .learner { animation: bob 3.2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }

    .eye { transform-origin: center; animation: blink 5s infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

    /* Code lines "type" across the screen, then reset */
    .code { transform-origin: left center; transform: scaleX(0); animation: type 6s ease-in-out infinite; }
    .code.l2 { animation-delay: .5s; }
    .code.l3 { animation-delay: 1s; }
    .code.l4 { animation-delay: 1.5s; }
    .code.l5 { animation-delay: 2s; }
    @keyframes type {
      0%   { transform: scaleX(0); }
      12%  { transform: scaleX(1); }
      80%  { transform: scaleX(1); opacity: 1; }
      92%, 100% { transform: scaleX(1); opacity: 0; }
    }
    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes cursor { 50% { opacity: 0; } }

    /* Idea nodes: an organic thought taking shape above the learner */
    .link { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 6s ease-in-out infinite; }
    .link.k2 { animation-delay: .6s; }
    .link.k3 { animation-delay: 1.2s; }
    @keyframes draw {
      0%, 10% { stroke-dashoffset: 40; opacity: 1; }
      35%, 80% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .node { transform-origin: center; animation: pop 6s cubic-bezier(.34,1.56,.64,1) infinite; }
    .node.n2 { animation-delay: .6s; }
    .node.n3 { animation-delay: 1.2s; }
    @keyframes pop {
      0%, 5%  { transform: scale(0); }
      15%, 80% { transform: scale(1); }
      95%, 100% { transform: scale(0); }
    }

    .steam { stroke-dasharray: 22; animation: steam 3s ease-in-out infinite; }
    .steam.s2 { animation-delay: 1.4s; }
    @keyframes steam {
      0%   { stroke-dashoffset: 22; opacity: 0; transform: translateY(4px); }
      40%  { opacity: .7; }
      100% { stroke-dashoffset: -22; opacity: 0; transform: translateY(-6px); }
    }

    .leaf { transform-origin: bottom center; animation: sway 4s ease-in-out infinite alternate; }
    .leaf.f2 { animation-delay: -2s; }
    @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

    @media (max-width: 600px) {
      .page { padding: 40px 16px 24px; }
      .lede { font-size: 1rem; }
    }

    /* Respect visitors who turn motion off: show the finished scene, still */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .code { transform: scaleX(1); }
      .link { stroke-dashoffset: 0; }
      .steam { opacity: .6; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="page">
    <div class="aurora" aria-hidden="true"></div>

    <span class="status"><span class="dot" aria-hidden="true"></span>Under construction</span>

    <div class="scene">
      <svg viewBox="0 0 360 250" role="img" aria-labelledby="scene-title">
        <title id="scene-title">A learner in a hard hat working at a computer, with ideas forming above them</title>

        <!-- Idea nodes -->
        <g stroke="var(--accent-glow)" stroke-width="2.5" stroke-linecap="round" fill="none">
          <path class="link"    d="M214 58 L244 36"/>
          <path class="link k2" d="M244 36 L278 50"/>
          <path class="link k3" d="M278 50 L262 80"/>
        </g>
        <circle class="node"    cx="214" cy="58" r="6"   fill="var(--accent)"/>
        <circle class="node n2" cx="244" cy="36" r="8"   fill="var(--accent-glow)"/>
        <circle class="node n3" cx="278" cy="50" r="5.5" fill="var(--accent-deep)"/>
        <circle class="node n3" cx="262" cy="80" r="4"   fill="var(--accent)"/>

        <!-- Learner, behind the monitor -->
        <g class="learner">
          <!-- shoulders -->
          <path d="M116 192 C116 158 146 142 180 142 C214 142 244 158 244 192 Z" fill="var(--accent)"/>
          <path d="M166 142 L180 160 L194 142" fill="none" stroke="var(--accent-deep)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
          <!-- neck and head -->
          <rect x="171" y="122" width="18" height="22" rx="6" fill="var(--skin)"/>
          <circle cx="180" cy="104" r="26" fill="var(--skin)"/>
          <!-- hair peeking under the hat -->
          <path d="M155 100 C155 92 160 86 166 84 L166 96 Z M205 100 C205 92 200 86 194 84 L194 96 Z" fill="var(--ink)"/>
          <!-- eyes -->
          <ellipse class="eye" cx="170" cy="106" rx="2.6" ry="3.2" fill="var(--ink)"/>
          <ellipse class="eye" cx="190" cy="106" rx="2.6" ry="3.2" fill="var(--ink)"/>
          <!-- hard hat -->
          <path d="M152 92 C152 72 164 62 180 62 C196 62 208 72 208 92 Z" fill="var(--accent-glow)"/>
          <path d="M176 62.5 L176 92 M184 62.5 L184 92" stroke="var(--paper)" stroke-width="2" opacity=".55"/>
          <rect x="146" y="89" width="68" height="7" rx="3.5" fill="var(--accent-deep)"/>
        </g>

        <!-- Monitor -->
        <rect x="102" y="117" width="156" height="78" rx="11" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>
        <g stroke-width="5" stroke-linecap="round">
          <line class="code l1" x1="118" y1="135" x2="176" y2="135" stroke="var(--accent)"/>
          <line class="code l2" x1="130" y1="147" x2="214" y2="147" stroke="var(--faint)"/>
          <line class="code l3" x1="130" y1="159" x2="190" y2="159" stroke="var(--accent-glow)"/>
          <line class="code l4" x1="142" y1="171" x2="236" y2="171" stroke="var(--faint)"/>
          <line class="code l5" x1="118" y1="183" x2="150" y2="183" stroke="var(--accent)"/>
        </g>
        <rect class="cursor" x="158" y="178" width="3" height="10" rx="1" fill="var(--ink)"/>
        <!-- stand -->
        <path d="M172 195 L169 212 L191 212 L188 195" fill="var(--paper-warm)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>

        <!-- Desk -->
        <line x1="26" y1="212" x2="334" y2="212" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="180" cy="236" rx="120" ry="5" fill="var(--line)"/>

        <!-- Mug with steam -->
        <path class="steam"    d="M281 182 C277 176 285 172 281 166" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round"/>
        <path class="steam s2" d="M291 182 C287 176 295 172 291 166" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round"/>
        <path d="M274 188 L298 188 L296 212 L276 212 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M297 194 C306 194 306 206 296 206" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>

        <!-- Plant -->
        <path class="leaf"    d="M66 192 C54 180 54 166 62 158 C70 168 70 182 66 192 Z" fill="var(--accent-glow)" opacity=".9"/>
        <path class="leaf f2" d="M68 192 C78 182 88 180 94 172 C92 186 82 194 68 192 Z" fill="var(--accent)" opacity=".75"/>
        <path d="M56 192 L80 192 L77 212 L59 212 Z" fill="var(--paper-warm)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="tape" aria-hidden="true"></div>

    <h1>Claude Academy <span class="serif">projects</span></h1>
    <p class="lede">I'm building small, useful things as I work through Claude Academy courses. They'll show up here as they're ready.</p>

    <a class="back" href="https://benbreaux.com"><span class="arrow" aria-hidden="true">&larr;</span> Back to benbreaux.com</a>

    <p class="footer">&copy; 2026 Ben Breaux &nbsp;&middot;&nbsp; <span class="mono">academy.benbreaux.com</span> &nbsp;&middot;&nbsp; Denver, CO</p>
  </main>
</body>
</html>
