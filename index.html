<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Academy Projects | Ben Breaux</title>
  <meta name="description" content="Projects Ben Breaux built while working through Claude Academy courses.">
  <style>
    /* Color tokens: light by default, swapped for dark mode below */
    :root {
      --bg: #fafaf8;
      --text: #1d1d1b;
      --muted: #5f5f5a;
      --line: #e2e2dc;
      --accent: #b4532a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615;
        --text: #ececea;
        --muted: #a3a39d;
        --line: #2e2e2b;
        --accent: #e08a5f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 680px; margin: 0 auto; padding: 56px 16px; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 12px; }
    h2 { font-size: 1.1rem; margin: 40px 0 12px; }
    p { margin: 0 0 16px; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
    ul.projects { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
    ul.projects li { padding: 14px 0; border-bottom: 1px solid var(--line); }
    footer { margin-top: 48px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Claude Academy Projects</h1>
    <p class="muted">Things I'm building while working through Claude Academy courses.</p>

    <h2>Projects</h2>
    <!-- Add one <li> per project: <li><a href="project-folder/">Name</a>: one-line description</li> -->
    <ul class="projects">
      <li class="muted">First project coming soon.</li>
    </ul>

    <footer class="muted">
      Ben Breaux · <a href="https://benbreaux.com">benbreaux.com</a>
    </footer>
  </main>
</body>
</html>
